
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Praktikum Version Control System</title>

    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/script.js" defer></script>
</head>
<body>

    <header class="header">
        <h1>Hubungi Kami</h1>
        <p>Kirimkan pertanyaan atau pesan kepada kami.</p>
    </header>

    <!-- Menu Navigasi -->
    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="about_us.html">About Us</a>
        <a href="contac.html" class="active">Contact</a>
    </nav>

    <main class="container">

        <section class="card">
            <h2>Formulir Kontak</h2>

            <p>
                Silakan isi formulir berikut apabila ingin
                menyampaikan pertanyaan, saran, atau pesan.
            </p>

            <form id="contactForm">

                <p>
                    <label for="nama">Nama</label><br>
                    <input type="text" id="nama"
                        placeholder="Masukkan nama kamu" required>
                </p>

                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email"
                        placeholder="nama@email.com" required>
                </p>

                <p>
                    <label for="pesanKontak">Pesan</label><br>
                    <textarea id="pesanKontak" rows="5"
                        placeholder="Tuliskan pesan kamu..."
                        required></textarea>
                </p>

                <button type="submit">Kirim Pesan</button>

                <p id="statusForm"></p>
            </form>
        </section>

    </main>

    <footer class="footer">
        <p>Praktikum Version Control System 2026</p>
    </footer>

</body>
</html>
